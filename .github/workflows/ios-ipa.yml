name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ios-ipa.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Xcode project and depth model
        run: |
          brew install xcodegen
          bash tools/fetch_model.sh
          xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project OutOfBody.xcodeproj -scheme OutOfBody \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/out-of-body" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA for local signing
        run: |
          app="$RUNNER_TEMP/out-of-body/Build/Products/Release-iphoneos/OutOfBody.app"
          test -x "$app/OutOfBody"
          staging=$(mktemp -d)
          mkdir "$staging/Payload"
          ditto "$app" "$staging/Payload/OutOfBody.app"
          cd "$staging"
          zip -qr "$GITHUB_WORKSPACE/OutOfBody.ipa" Payload
      - uses: actions/upload-artifact@v6
        with:
          name: OutOfBody-unsigned
          path: OutOfBody.ipa
          if-no-files-found: error
